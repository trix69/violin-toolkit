<title>Violin Fingerboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Title, key picker, now-playing strip, then a dark ebony fingerboard.
   Open strings sit above the nut; each note's height below the nut follows its semitone distance,
   with finger-row labels in a right-hand column. */
:root {
  --bg: #ECEFEB;
  --fg: #16201B;
  --muted: #56655E;
  --panel: #F8FAF7;
  --line: #C8D1CA;
  --accent: #16201B;
  --on-accent: #ECEFEB;
  --board: #46524C;   /* same as the tuner */
  --board-text: #C9D3CC;
  --board-line: rgba(233, 240, 235, 0.22);
  --string: #D9D1BF;
  --nut: #EDE6D3;
  --ink: #15110F;
  --board-good: #6FD6A0;
  --pc-good: #5BD08E;   /* the tuner's in-tune green on a dark surface */
  --pc-off: #9AA59F;    /* grey for a pitch well away from the note */
  --off: #6A7770;
  --off-ink: #E6EEE8;
  --g: #E3A24C;
  --d: #74C493;
  --a: #66AEE6;
  --e: #C592E6;
  --font-display: 'DM Sans', system-ui, sans-serif;
  --font-note: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512;
    --fg: #E5ECE7;
    --muted: #94A49B;
    --panel: #16201B;
    --line: #2A3830;
    --accent: #E5ECE7;
    --on-accent: #0E1512;
    --board: #2C3833;
    --off: #52625A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512;
  --fg: #E5ECE7;
  --muted: #94A49B;
  --panel: #16201B;
  --line: #2A3830;
  --accent: #E5ECE7;
  --on-accent: #0E1512;
  --board: #2C3833;
  --off: #52625A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-note);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
}
.app { display: grid; gap: 10px; }

h1 {
  font: 700 28px/1.1 var(--font-display);
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.sub {
  margin: 4px 0 0;
  font: 400 12px var(--font-mono);
  letter-spacing: 0.04em;
  color: var(--muted);
}

.controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; }
.inl { display: inline-flex; align-items: center; gap: 10px; }
.lbl {
  font: 500 13px/1 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.lbl-a4 { text-transform: none; }   /* a pitch name, not a caption: solfège La4 must not become LA4 */
/* two rows, Major and Minor; each scrolls sideways when its 12 keys don't fit, most common first */
.keyrows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.majorrow { display: contents; }
.keys {
  min-width: 0; display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity; scroll-padding-inline: 0;
}
.keys::-webkit-scrollbar { display: none; }
/* soft edge where more keys are hidden */
.keys.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.keys.fade-l { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent); }
.keys.fade-l.fade-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.keys button {
  flex: 1 0 44px; min-width: 44px; height: 38px; padding: 0; scroll-snap-align: start;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg);
  font-size: 0; line-height: 0;
  cursor: pointer;
}
.keys button::after {
  content: attr(data-label);
  font: 600 18px var(--font-note);
  pointer-events: none;
}
.keys button[aria-pressed="true"] {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}
select {
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px;
  font: 500 14px var(--font-mono);
}
.switch {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 7px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-mono);
  cursor: pointer;
}
.switch .track {
  position: relative; flex: none;
  width: 40px; height: 22px; border-radius: 11px;
  background: var(--line);
  transition: background 120ms;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--muted);
  transition: transform 120ms, background 120ms;
}
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); background: var(--on-accent); }
/* off limits in Pitch Check (the choice is kept and comes back with the positions) */
.switch:disabled { opacity: .45; cursor: not-allowed; }
.inl:has(> .switch:disabled) > .lbl { opacity: .45; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.now {
  display: flex; align-items: baseline; gap: 16px;
  min-height: 66px; padding: 12px 16px;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px;
}
.now .name { font: 400 36px/1 var(--font-display); min-width: 3.4ch; }
.now .info { font: 400 14px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.now.on { border-color: var(--accent); }
.now.on .name { color: var(--accent); }
.now.idle .name { font-size: 18px; font-family: var(--font-mono); color: var(--muted); min-width: 0; }

.stage {
  --r: 20px; --head: 50px; --oy: 24px; --k: 3.5px; --span: 400px; --fs: 19px;
  display: grid; grid-template-columns: 1fr 56px;
  background: var(--board);
  border-radius: 16px;
  padding-block: 8px;
  overflow: hidden;
}
.board {
  position: relative;
  height: calc(var(--head) + var(--span) + var(--r) + 10px);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.labels {
  position: relative;
  color: var(--board-text);
  font: 500 11px var(--font-mono);
  letter-spacing: 0.05em; text-transform: uppercase;
}
.labels span {
  position: absolute; left: 6px; right: 0; top: var(--y);
  transform: translateY(-50%); line-height: 1.25;
}
.labels small { display: block; font-size: 8px; letter-spacing: 0.08em; opacity: 0.85; }
.labels small.fing:lang(zh) { display: inline; font-size: inherit; letter-spacing: 0; opacity: 1; }

.string {
  position: absolute; top: var(--oy); bottom: 0;
  left: var(--x); width: var(--w);
  transform: translateX(-50%);
  border-radius: 2px;
  background: linear-gradient(90deg, rgba(0,0,0,.4), var(--string) 40%, rgba(255,255,255,.55) 58%, var(--string));
}
.nut {
  position: absolute; left: 0; right: 0; top: calc(var(--head) - 2.5px); height: 5px;
  background: var(--nut);
}
.split {
  position: absolute; left: 0; right: 0; top: var(--y);
  border-top: 1px dashed var(--board-line);
}

.note {
  position: absolute; left: var(--x); top: var(--y);
  width: calc(var(--r) * 2); height: calc(var(--r) * 2);
  padding: 0; border: 2px solid var(--board); border-radius: 50%;
  display: grid; place-items: center;
  background: var(--hue); color: var(--ink);
  font-size: 0;
  line-height: 0;
  transform: translate(-50%, calc(-50% + var(--ty, 0px))) scale(var(--s, 1));
  transition: transform 60ms ease-out, box-shadow 80ms ease-out, filter 80ms;
  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.note::before {
  /* invisible, larger touch area than the circle; --hx / --hy are set in hitAreas() */
  content: ''; position: absolute;
  left: calc(50% - var(--hx, var(--r))); width: calc(var(--hx, var(--r)) * 2);
  top: calc(50% - var(--hu, var(--r))); height: calc(var(--hu, var(--r)) + var(--hd, var(--r)));
}
.note::after {
  content: attr(data-label);
  font: 700 var(--fs, 22px)/1 var(--font-note);
  pointer-events: none;
  -webkit-user-select: none; user-select: none;
}
.stage, .stage * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.note:not(.off) {
  /* glossy dome: light spot top-left, darker rim, soft drop shadow */
  background: radial-gradient(circle at 36% 28%, color-mix(in srgb, var(--hue) 45%, white) 0, var(--hue) 52%, color-mix(in srgb, var(--hue) 78%, black) 100%);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .45);
}
.note.off {
  background: color-mix(in srgb, var(--off) 42%, transparent);
  color: color-mix(in srgb, var(--off-ink) 72%, transparent);
  border-color: rgba(233, 226, 210, 0.22);
  box-shadow: none;
}
.note.off.heard, .note.off.down { background: color-mix(in srgb, var(--off) 80%, transparent); color: var(--off-ink); }
.note.harm { border: 2px dashed var(--nut); }
.note.root { box-shadow: 0 2px 4px rgba(0, 0, 0, .45), inset 0 0 0 2px var(--nut); }
.note.down {
  --s: 0.97; --ty: 1.5px;
  filter: brightness(1.05);
}
.note.down:not(.off) {
  background: radial-gradient(circle at 50% 60%, var(--hue) 0, color-mix(in srgb, var(--hue) 82%, black) 100%);
  box-shadow: 0 0 0 rgba(0, 0, 0, 0), inset 0 2px 5px rgba(0, 0, 0, .35);
}
.note.heard {
  --s: 1.1;
  filter: brightness(1.15);
  box-shadow:
    0 0 0 5px color-mix(in srgb, var(--hue) 45%, transparent),
    0 0 22px 4px color-mix(in srgb, var(--hue) 60%, transparent);
}
@media (hover: hover) { .note:hover:not(.down):not(.heard) { filter: brightness(1.1); } }
.note:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.tip { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 65ch; }

.ksig {
  position: fixed; left: 50%; top: 52%; z-index: 20;
  transform: translate(-50%, -50%) scale(.94);
  padding: 10px 18px 8px; border-radius: 16px;
  background: #FBFCFA; color: #16201B;
  border: 1px solid var(--line);
  box-shadow: 0 10px 34px rgba(0,0,0,.28);
  text-align: center;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .5s ease-out, transform .5s ease-out, visibility 0s .5s;
}
.ksig.on { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); transition: opacity .12s ease-out, transform .12s ease-out; }
.ksig svg { display: block; width: 220px; height: 240px; }
.ksig { width: 256px; box-sizing: border-box; }
.ksig .cap { white-space: nowrap; font: 500 15px var(--font-mono); margin-top: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .ksig, .ksig.on { transition: none; } }

.posbar {
  position: sticky; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr 1fr 1fr 1.7fr; gap: 6px;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}
.posbar button {
  height: 34px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-note); padding: 0 2px;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
.posbar button[aria-pressed="true"] {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}
.posbar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Pitch Check readout in the right-hand column */
/* the note heard and how far off it is, level with that note on the board; blank while nothing is heard */
.pc { position: absolute; inset: 0; }
.pc-read { position: absolute; left: 6px; right: 0; top: var(--y, 0); transform: translateY(-50%); transition: top 120ms ease-out; }
.pc:not(.on) .pc-read { visibility: hidden; }
.pc-name { font: 700 21px/1 var(--font-note); color: var(--nut); white-space: nowrap; text-transform: none; }   /* a note name keeps its case: Fa5, not FA5 */
.pc-cents { margin-top: 3px; font: 500 12px/1.2 var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--board-text); white-space: nowrap; }
.pc.on .pc-name { color: var(--nut); }
.pc.tune .pc-cents { color: var(--board-good); }
.pc:not(.on) .pc-name { color: var(--board-text); }
/* Pitch Check: the pitch heard, as a disc sliding along every string that can play it.
   It sits behind the note discs and is a little bigger, so in tune it shows as a ring round the
   note, sharp it peeks out below, flat above. Its colour runs from the tuner's green (within
   3 cents) to grey (25 cents or more off); --gp is set by pcShow(). */
.pcm {
  --pcc: color-mix(in srgb, var(--pc-good) var(--gp, 0%), var(--pc-off));
  position: absolute; left: var(--x); top: 0;
  width: calc(var(--r) * 2 + 16px); height: calc(var(--r) * 2 + 16px);
  border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--pcc); opacity: 0; pointer-events: none;
  box-shadow: 0 0 12px 2px color-mix(in srgb, var(--pcc) 55%, transparent);
  transition: top 90ms linear, opacity 120ms, background-color 120ms;
}
.pcm.on { opacity: .9; }
.board.pcmode .note.heard { box-shadow: 0 2px 4px rgba(0, 0, 0, .45); }
/* in Pitch Check a finger on the board can scroll the page */
.board.pcmode, .board.pcmode .note { touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  .note { transition: none; }
  .pcm { transition: none; }
}
</style>

<main class="app">
  <header>
    <h1>Violin Fingerboard</h1>
    <p class="sub" id="sub">G major · 1st position</p>
  </header>

  <div class="controls">
    <div class="inl" role="group" aria-labelledby="vibLabel">
      <span class="lbl" id="vibLabel">Auto vibrato</span>
      <button type="button" class="switch" id="vibrato" role="switch" aria-checked="true" aria-labelledby="vibLabel">
        <span id="vibText">On</span>
        <span class="track" aria-hidden="true"></span>
      </button>
    </div>
    <label class="inl" for="tuning">
      <span class="lbl lbl-a4">A4</span>
      <select id="tuning">
        <option value="442">442 Hz</option>
        <option value="440">440 Hz</option>
      </select>
    </label>
  </div>

  <div class="keyrows" id="keyrows">
    <div class="majorrow" role="group" aria-labelledby="keyLabel">
      <span class="lbl" id="keyLabel">Major</span>
      <div class="keys" id="keys"></div>
    </div>
    <div class="majorrow" role="group" aria-labelledby="minLabel">
      <span class="lbl" id="minLabel">Minor</span>
      <div class="keys" id="keysMin"></div>
    </div>
  </div>

  <div class="stage">
    <div class="board" id="board"></div>
    <div class="labels" id="labels"></div>
  </div>

  <div class="ksig" id="ksig" aria-hidden="true"></div>
  <div class="visually-hidden" id="ksigSr" role="status" aria-live="polite"></div>

  <div class="posbar" id="posbar" role="group" aria-label="Position">
    <button type="button" data-id="1" aria-pressed="true" aria-label="1st position">1st</button>
    <button type="button" data-id="2" aria-pressed="false" aria-label="2nd position">2nd</button>
    <button type="button" data-id="3" aria-pressed="false" aria-label="3rd position">3rd</button>
    <button type="button" data-id="pc" aria-pressed="false">Pitch Check</button>
  </div>
</main>

<script>
(function () {
  var NAMES_S = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  var NAMES_F = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
  /* all 12 majors (in the order violinists usually meet them) and 12 (natural) minors;
     acc / n = the key signature */
  function K(id, label, mode, acc, n) {
    var L = 'CDEFGAB'.indexOf(label[0].toUpperCase()), alt = label[1] === '♯' ? 1 : label[1] === '♭' ? -1 : 0;
    return { id: id, label: label, mode: mode, letter: L, root: (NAT[L] + alt + 12) % 12, acc: acc, n: n, flat: acc === 'F' };
  }
  var NAT = [0, 2, 4, 5, 7, 9, 11];
  var KEYS = [
    K('G', 'G', 'major', 'S', 1), K('D', 'D', 'major', 'S', 2), K('A', 'A', 'major', 'S', 3),
    K('C', 'C', 'major', 'S', 0), K('F', 'F', 'major', 'F', 1), K('Bb', 'B♭', 'major', 'F', 2),
    K('E', 'E', 'major', 'S', 4), K('Eb', 'E♭', 'major', 'F', 3), K('B', 'B', 'major', 'S', 5),
    K('Ab', 'A♭', 'major', 'F', 4), K('Db', 'D♭', 'major', 'F', 5), K('Gb', 'G♭', 'major', 'F', 6),
    /* minors in lower case, each under the major with the same key signature (its relative major) */
    K('Em', 'e', 'minor', 'S', 1), K('Bm', 'b', 'minor', 'S', 2), K('F#m', 'f♯', 'minor', 'S', 3),
    K('Am', 'a', 'minor', 'S', 0), K('Dm', 'd', 'minor', 'F', 1), K('Gm', 'g', 'minor', 'F', 2),
    K('C#m', 'c♯', 'minor', 'S', 4), K('Cm', 'c', 'minor', 'F', 3), K('G#m', 'g♯', 'minor', 'S', 5),
    K('Fm', 'f', 'minor', 'F', 4), K('Bbm', 'b♭', 'minor', 'F', 5), K('Ebm', 'e♭', 'minor', 'F', 6)
  ];
  var SCALE = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
  /* how each semitone above the tonic is spelled: [interval, letter steps]. Minor keys also spell the
     raised 6th and 7th of the melodic / harmonic forms (e.g. G♯ in A minor, C♯ in D minor). */
  var SPELL = { major: [[0,0],[2,1],[4,2],[5,3],[7,4],[9,5],[11,6]],
                minor: [[0,0],[2,1],[3,2],[5,3],[7,4],[8,5],[9,5],[10,6],[11,6]] };
  var STRINGS = [
    { n: 'G', midi: 55, v: '--g' },
    { n: 'D', midi: 62, v: '--d' },
    { n: 'A', midi: 69, v: '--a' },
    { n: 'E', midi: 76, v: '--e' }
  ];
  var ORD = ['open', '1st', '2nd', '3rd', '4th'];
  var WIDTHS = [3.4, 2.8, 2.2, 1.5];
  var MAXN = 12;           /* the octave: where the natural harmonic sits, half way along the string */
  var STRING_MM = 328;     /* 4/4 violin string length */

  /* lo..hi is the range of semitones the hand can reach without shifting. Notes inside it show in colour. */
  var POSITIONS = {
    '1': { name: '1st position', lo: 0, hi: 7,
           splits: [2.5, 4.5, 6.5, 7.5, 11.5], at: [1.5, 3.5, 5.5, 7], edge: { n: 9.5, text: 'above', sub: '4th finger' } },
    '2': { name: '2nd position', lo: 3, hi: 9,
           splits: [2.5, 4.5, 6.5, 8.5, 9.5, 11.5], at: [3.5, 5.5, 7.5, 9],
           edge: [{ n: 1.5, text: 'below', sub: '1st finger' }, { n: 10.6, text: 'above', sub: '4th finger' }] },
    '3': { name: '3rd position', lo: 5, hi: 12,
           splits: [4.5, 6.5, 8.5, 10.5, 11.5], at: [5.5, 7.5, 9.5, 11], edge: { n: 2.5, text: 'below', sub: '1st finger' } }
  };

  var board = document.getElementById('board');
  var labels = document.getElementById('labels');
  var keysEl = document.getElementById('keys');
  var subEl = document.getElementById('sub');
  var stage = document.querySelector('.stage');
  var posbar = document.getElementById('posbar');
  var vibBtn = document.getElementById('vibrato');
  var vibText = document.getElementById('vibText');
  var tuningSel = document.getElementById('tuning');

  var state = { key: 'G', vibrato: true, tuning: 442, pos: '1' };
  try {
    var saved = JSON.parse(localStorage.getItem('violin-fingerboard-v2') || '{}');
    if (KEYS.some(function (k) { return k.id === saved.key; })) state.key = saved.key;
    if (typeof saved.vibrato === 'boolean') state.vibrato = saved.vibrato;
    if (['440', '442'].indexOf(String(saved.tuning)) >= 0) state.tuning = +saved.tuning;
  } catch (err) {}
  function persist() {
    try { localStorage.setItem('violin-fingerboard-v2', JSON.stringify({ key: state.key, vibrato: state.vibrato, tuning: state.tuning })); } catch (err) {}
  }

  function showVib() {
    vibBtn.setAttribute('aria-checked', state.vibrato ? 'true' : 'false');
    vibText.textContent = state.vibrato ? 'On' : 'Off';
  }

    }).catch(function (err) {
      if (mic === token) { mic = null; APP.mic('pc', false); }
      pcStatus = (err && err.name === 'NotAllowedError') ? 'microphone blocked' : 'microphone not available here';
      updateSub();
    });
  }

  function stopMic() {
    var m = mic;
    mic = null;
    APP.mic('pc', false);
    if (pcRaf) { cancelAnimationFrame(pcRaf); pcRaf = 0; }
    if (m && m.stream) {
      m.stream.getTracks().forEach(function (t) { t.stop(); });
      try { m.src.disconnect(); } catch (err) {}
    }
    hist = [];
    pcStatus = '';
    pcCur = null;
    pcShow(null);
    clearHeard();
  }

  function pcLoop(token) {
    pcRaf = requestAnimationFrame(function (t) {
      pcRaf = 0;
      if (mic !== token) return;
      if (t - pcLast >= 45) { pcLast = t; analyse(token); }
      pcLoop(token);
    });
  }

  function analyse(token) {
    token.an.getFloatTimeDomainData(token.buf);
    var buf = token.buf, i, e = 0;
    for (i = 0; i < buf.length; i++) e += buf[i] * buf[i];
    var rms = Math.sqrt(e / buf.length);
    var now = performance.now();
    var f = pcGate.feed(rms, rms > 0.01 ? yin(buf, ctx.sampleRate, 150, 3000) : 0, now);
    if (!f || f < 180 || f > 3300) {
      if (now - lastHeard > 400 && pcStatus !== 'listening…') {
        hist = []; clearHeard(); pcStatus = 'listening…'; pcCur = null; pcShow(null); updateSub();
      }
      return;
    }
    var m = 69 + 12 * Math.log(f / state.tuning) / Math.LN2;
    var n = Math.round(m);
    /* against the note's just target when Settings > Intonation is just; an open string's pitch, or its
       octave harmonic's, also counts as in tune at the string's own tuning (Hermes R13.1) */
    var raw = (m - n) * 100, cents = raw - stopCents(n);
    STRINGS.forEach(function (st) { var c = raw - openCents(st); if ((st.midi === n || st.midi + MAXN === n) && Math.abs(c) < Math.abs(cents)) cents = c; });
    cents = Math.round(cents);
    hist.push(n);
    if (hist.length > 3) hist.shift();
    var agree = hist.filter(function (x) { return x === n; }).length;
    if (agree < 2) return;
    lastHeard = now;
    var found = false;
    notes.forEach(function (nt, k) {
      var hit = nt.midi === n;
      if (hit) found = true;
      if (buttons[k]) buttons[k].classList.toggle('heard', hit);
    });
    pcStatus = noteName(n, true) + ' · ' +
      (pcInTune(cents) ? 'in tune' : Math.abs(cents) + '¢ ' + (cents > 0 ? 'sharp' : 'flat')) +
      (found ? '' : ' · off the board');
    pcCur = { name: noteName(n, true), cents: cents, m: m };
    pcShow(pcCur);
    updateSub();
  }

  /* ---------- Press and hold ---------- */
  var voices = new Map();

  function applyVib(rec) {
    var want = state.vibrato && state.pos !== 'pc' && !rec.open && (performance.now() - rec.t0 >= 190);
    if (want !== rec.vibOn) {
      rec.vibOn = want;
      if (rec.v.vib) rec.v.vib(want);
    }
  }

  function begin(el, id) {
    if (state.pos === 'pc') return;   /* Pitch Check listens instead of playing */
    if (voices.has(id)) return;
    APP.playThroughSilent();
    if (!ensureCtx()) return;
    var nt = notes[+el.dataset.i];
    if (!nt) return;
    var rec = { el: el, v: startVoice(noteFreq(nt)), t0: performance.now(), vibOn: false, timer: 0, open: nt.n === 0 || nt.n === MAXN };   /* open strings and harmonics stay steady */
    voices.set(id, rec);
    rec.timer = setTimeout(function () { applyVib(rec); }, 200);   /* vibrato starts after 200 ms of holding */
    el.classList.add('down');
    followPosition(nt);
  }
  function end(id) {
    var rec = voices.get(id);
    if (!rec) return;
    voices.delete(id);
    clearTimeout(rec.timer);
    stopVoice(rec.v);
    var stillDown = false;
    voices.forEach(function (r) { if (r.el === rec.el) stillDown = true; });
    if (!stillDown) rec.el.classList.remove('down');
  }
  function stopAll() {
    Array.from(voices.keys()).forEach(end);
  }

  board.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var el = e.target.closest ? e.target.closest('.note') : null;
    if (!el) return;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    begin(el, 'p' + e.pointerId);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    board.addEventListener(ev, function (e) { end('p' + e.pointerId); });
  });
  board.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  board.addEventListener('selectstart', function (e) { e.preventDefault(); });
  board.addEventListener('dragstart', function (e) { e.preventDefault(); });
  board.addEventListener('touchstart', function (e) {
    /* in Pitch Check a touch may scroll the page instead */
    if (state.pos !== 'pc' && e.target.closest && e.target.closest('.note')) e.preventDefault();
  }, { passive: false });

  board.addEventListener('keydown', function (e) {
    var el = e.target.closest ? e.target.closest('.note') : null;
    if (!el || (e.key !== ' ' && e.key !== 'Enter')) return;
    e.preventDefault();
    if (!e.repeat) begin(el, 'k' + el.dataset.i);
  });
  board.addEventListener('keyup', function (e) {
    var el = e.target.closest ? e.target.closest('.note') : null;
    if (el && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); end('k' + el.dataset.i); }
  });
  board.addEventListener('focusout', function (e) {
    var el = e.target.closest ? e.target.closest('.note') : null;
    if (el) end('k' + el.dataset.i);
  });
  window.addEventListener('blur', stopAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopAll(); });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
  window.addEventListener('load', layout);

  render();
  setTimeout(layout, 300);
})();
</script>
