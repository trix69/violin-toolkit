<div class="mp" id="mp">
  <div class="mp-top" id="mpTop">
    <div class="mp-row">
      <label class="mp-song"><span class="mp-vh">Tune</span><select id="mpSong"></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></label>
      <button type="button" class="mp-del" id="mpDel" aria-label="Delete this file" title="Delete this file" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11v5M14 11v5"/></svg></button>
      <button type="button" class="mp-import" id="mpImport"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 14.5v4a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-4"/></svg>Import</button>
      <input type="file" id="mpFile" accept=".mid,.midi,audio/midi,audio/x-midi,.musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml,application/xml,text/xml" hidden>
    </div>
    <p class="mp-msg" id="mpMsg" role="status" hidden></p>
    <div class="mp-score" id="mpScore" translate="no"><div class="mp-barno" id="mpBarNo" aria-hidden="true"></div><div class="mp-strip" id="mpSvg" aria-hidden="true"></div><svg class="mp-key" id="mpKey" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg><div class="mp-head" id="mpHead" aria-hidden="true"></div><div class="mp-count" id="mpCount" aria-hidden="true" hidden></div><button type="button" class="mp-fg" id="mpFg" aria-label="Fingerings: this tune on pages, as a PDF" title="Fingerings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7H18"/><path d="M9 11.5h6M9 14.5h6M9 17.5h3.5"/></svg></button><div class="mp-parts" id="mpParts" aria-hidden="true" hidden><p><b id="mpPartsLV">Violin</b><span id="mpPartsV"></span></p><p><b id="mpPartsLA">Accompaniment</b><span id="mpPartsA"></span></p><p><b id="mpPartsLD">Left out</b><span id="mpPartsD"></span></p></div></div>
    <p class="mp-vh" id="mpPartsSr" role="status"></p>
  </div>
  <div class="mp-bar" id="mpBar">
    <div class="mp-mixpop" id="mpMixPop" role="group" aria-label="Mixer" hidden>
      <label class="mp-vol"><span>Violin</span><span class="mp-fader"><input type="range" id="mpVolV" min="0" max="100" step="5" aria-label="Violin volume"></span><output id="mpVolVOut" translate="no"></output></label>
      <label class="mp-vol"><span>Accompaniment</span><span class="mp-fader"><input type="range" id="mpVolA" min="0" max="100" step="5" aria-label="Accompaniment volume"></span><output id="mpVolAOut" translate="no"></output></label>
      <label class="mp-vol"><span>Metronome</span><span class="mp-fader"><input type="range" id="mpVolM" min="0" max="100" step="5" aria-label="Metronome volume"></span><output id="mpVolMOut" translate="no"></output></label>
      <p class="mp-mixnone" id="mpMixNone" hidden>This tune has no accompaniment.</p>
      <div class="mp-vibrow"><span id="mpVibLbl">Vibrato on long notes</span><button type="button" class="mp-vib" id="mpVib" role="switch" aria-checked="false" aria-labelledby="mpVibLbl"><span id="mpVibTxt">Off</span><span class="trk" aria-hidden="true"></span></button></div>
    </div>
    <div class="mp-abpop" id="mpABPop" role="dialog" aria-labelledby="mpABTitle" hidden>
      <p class="mp-abtitle" id="mpABTitle">Repeat bars</p>
      <label class="mp-absel"><span>From bar (A)</span><select id="mpA" translate="no"></select></label>
      <label class="mp-absel"><span>To bar (B)</span><select id="mpB" translate="no"></select></label>
      <div class="mp-abbtns"><button type="button" id="mpABOff" hidden>Off</button><button type="button" id="mpABCancel">Cancel</button><button type="button" class="primary" id="mpABSet">Repeat</button></div>
    </div>
    <div class="mp-prog"><input type="range" id="mpSeek" min="0" max="1000" value="0" aria-label="Playback position"><span class="mp-time" id="mpTime">0:00 / 0:00</span><button type="button" class="mp-loop" id="mpLoop" aria-pressed="false" aria-label="Loop" title="Loop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4v1"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4v-1"/></svg></button><button type="button" class="mp-loop mp-ab" id="mpAB" aria-pressed="false" aria-expanded="false" aria-controls="mpABPop" aria-label="Repeat a passage (A–B)" title="Repeat a passage (A–B)" translate="no">A–B</button><span class="mp-lvwrap"><button type="button" class="mp-loop mp-ab mp-lvbtn" id="mpLvBtn" aria-haspopup="true" aria-expanded="false" aria-controls="mpLvMenu" aria-label="Fingerings shown" title="Fingerings shown" translate="no"><span id="mpLvGlyph">123</span></button><span class="mp-lvmenu" id="mpLvMenu" role="menu" aria-label="Fingerings shown" hidden><button type="button" role="menuitemradio" aria-checked="true" data-lv="full">Full</button><button type="button" role="menuitemradio" aria-checked="false" data-lv="medium">Medium</button><button type="button" role="menuitemradio" aria-checked="false" data-lv="minimum">Minimum</button></span></span><button type="button" class="mp-loop mp-full" id="mpFull" aria-pressed="false" aria-label="Full screen" title="Full screen"><svg class="i-in" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l6 6M4 9.5V4h5.5M20 20l-6-6M20 14.5V20h-5.5"/></svg><svg class="i-out" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l6 6M10 4.5V10H4.5M20 20l-6-6M14 19.5V14h5.5"/></svg></button></div>
    <div class="mp-ctl">
      <button type="button" class="mp-btn" id="mpStart" aria-label="Back to start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M18 5.5v13L8.5 12z" fill="currentColor"/></svg></button>
      <button type="button" class="mp-btn" id="mpSlower" aria-label="Slower">−</button>
      <button type="button" class="mp-play" id="mpPlay" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13L19 12z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13M16 5.5v13"/></svg></button>
      <button type="button" class="mp-btn" id="mpFaster" aria-label="Faster">+</button>
      <button type="button" class="mp-btn mp-mix" id="mpMix" aria-expanded="false" aria-controls="mpMixPop" aria-label="Mixer" title="Mixer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="3.5" y="13" width="5" height="3" rx="1" fill="currentColor"/><rect x="9.5" y="7" width="5" height="3" rx="1" fill="currentColor"/><rect x="15.5" y="11" width="5" height="3" rx="1" fill="currentColor"/></svg></button>
      <div class="mp-speed"><span id="mpSpeed">100%</span><small id="mpBpm" translate="no"></small></div>
    </div>
  </div>
</div>
